# Enterprise 11-service stack with 3-zone network isolation and Envoy ingress:
#   docker compose -f deploy/compose.yml --env-file deploy/.env up -d --wait
name: aoc

x-hardened: &hardened
  user: "65532:65532"
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev
    - /app/logs:rw,noexec,nosuid,nodev
  restart: unless-stopped
  cpus: 1.0
  mem_limit: 512m

services:
  postgres:
    container_name: aoc-postgres
    hostname: postgres
    build:
      context: ..
      dockerfile: src/deploy/docker/postgres.Dockerfile
      args:
        PGPORT: ${POSTGRES_PORT:-5432}
        POSTGRES_USER: ${POSTGRES_USER:-aoc}
        POSTGRES_DB: ${POSTGRES_DB:-aoc}
    image: sandal-postgres:local
    user: "70:70"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
      - /var/run/postgresql:rw,noexec,nosuid,nodev
      - /app/logs:rw,noexec,nosuid,nodev
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 1g
    shm_size: 256m
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=768MB"
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "wal_buffers=8MB"
      - "-c"
      - "min_wal_size=64MB"
      - "-c"
      - "max_wal_size=512MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "jit=off"
      - "-c"
      - "max_connections=120"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aoc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME}
      POSTGRES_DB: ${POSTGRES_DB:-aoc}
      PGPORT: ${POSTGRES_PORT:-5432}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - data_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-aoc} -d ${POSTGRES_DB:-aoc}"]
      interval: 2s
      timeout: 3s
      start_period: 5s
      retries: 30

  auth:
    <<: *hardened
    container_name: aoc-auth
    hostname: auth
    build:
      context: ..
      dockerfile: src/deploy/docker/go.Dockerfile
      target: auth
      args:
        SERVICE_NAME: auth
        SERVICE_GRPC_PORT: ${AUTH_GRPC_PORT:-50052}
    image: sandal-auth:local
    command: ["-http=:${AUTH_HTTP_PORT:-8081}", "-grpc=:${AUTH_GRPC_PORT:-50052}"]
    environment:
      AOC_ENV: ${AOC_ENV:-production}
      AOC_ALLOW_INSECURE_DB: "1"
      DATABASE_URL: postgres://${POSTGRES_USER:-aoc}:${POSTGRES_PASSWORD:-CHANGE_ME}@postgres:5432/${POSTGRES_DB:-aoc}?sslmode=disable
      AOC_DATABASE_URL: postgres://${POSTGRES_USER:-aoc}:${POSTGRES_PASSWORD:-CHANGE_ME}@postgres:5432/${POSTGRES_DB:-aoc}?sslmode=disable
      AOC_DB_MAX_CONNS: "${AOC_DB_MAX_CONNS:-16}"
      AOC_DB_MIN_CONNS: "${AOC_DB_MIN_CONNS:-2}"
      AOC_SERVICE_TOKEN: ${AOC_SERVICE_TOKEN:-dev-local-service-token-32bytes!}
      AOC_AUTH_HTTP_ADDR: ":${AUTH_HTTP_PORT:-8081}"
      AOC_AUTH_HTTP_BIND_ADDR: ":${AUTH_HTTP_PORT:-8081}"
      AOC_AUTH_GRPC_ADDR: ":${AUTH_GRPC_PORT:-50052}"
      AOC_AUTH_GRPC_BIND_ADDR: ":${AUTH_GRPC_PORT:-50052}"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - service_net
      - data_net
    healthcheck:
      test: ["CMD", "/usr/local/bin/service", "-healthcheck"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 5

  character:
    <<: *hardened
    container_name: aoc-character
    hostname: character
    build:
      context: ..
      dockerfile: src/deploy/docker/go.Dockerfile
      target: character
      args:
        SERVICE_NAME: character
        SERVICE_GRPC_PORT: ${CHARACTER_GRPC_PORT:-50053}
    image: sandal-character:local
    command: ["-addr=:${CHARACTER_GRPC_PORT:-50053}"]
    environment:
      AOC_ENV: ${AOC_ENV:-production}
      AOC_ALLOW_INSECURE_DB: "1"
      DATABASE_URL: postgres://${POSTGRES_USER:-aoc}:${POSTGRES_PASSWORD:-CHANGE_ME}@postgres:5432/${POSTGRES_DB:-aoc}?sslmode=disable
      AOC_DATABASE_URL: postgres://${POSTGRES_USER:-aoc}:${POSTGRES_PASSWORD:-CHANGE_ME}@postgres:5432/${POSTGRES_DB:-aoc}?sslmode=disable
      AOC_DB_MAX_CONNS: "${AOC_DB_MAX_CONNS:-16}"
      AOC_DB_MIN_CONNS: "${AOC_DB_MIN_CONNS:-2}"
      AOC_SERVICE_TOKEN: ${AOC_SERVICE_TOKEN:-dev-local-service-token-32bytes!}
      AOC_CHAR_GRPC_ADDR: ":${CHARACTER_GRPC_PORT:-50053}"
      AOC_CHARACTER_GRPC_ADDR: ":${CHARACTER_GRPC_PORT:-50053}"
      AOC_CHARACTER_GRPC_BIND_ADDR: ":${CHARACTER_GRPC_PORT:-50053}"
      AOC_GM_STARTER_SET: "${AOC_GM_STARTER_SET:-true}"
    volumes:
      - ${AOC_DIST_CONTENT_DIR:-./content}:/app/dist/content:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - service_net
      - data_net
    healthcheck:
      test: ["CMD", "/usr/local/bin/service", "-healthcheck"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 5

  citynode:
    <<: *hardened
    container_name: aoc-citynode
    hostname: citynode
    build:
      context: ..
      dockerfile: src/deploy/docker/go.Dockerfile
      target: citynode
      args:
        SERVICE_NAME: citynode
        SERVICE_GRPC_PORT: ${CITYNODE_GRPC_PORT:-50056}
    image: sandal-citynode:local
    command: ["-addr=:${CITYNODE_GRPC_PORT:-50056}", "-seed=/app/config/seeds/citynode_seed.json"]
    environment:
      AOC_ENV: ${AOC_ENV:-production}
      AOC_ALLOW_INSECURE_DB: "1"
      DATABASE_URL: postgres://${POSTGRES_USER:-aoc}:${POSTGRES_PASSWORD:-CHANGE_ME}@postgres:5432/${POSTGRES_DB:-aoc}?sslmode=disable
      AOC_DATABASE_URL: postgres://${POSTGRES_USER:-aoc}:${POSTGRES_PASSWORD:-CHANGE_ME}@postgres:5432/${POSTGRES_DB:-aoc}?sslmode=disable
      AOC_DB_MAX_CONNS: "${AOC_DB_MAX_CONNS:-16}"
      AOC_DB_MIN_CONNS: "${AOC_DB_MIN_CONNS:-2}"
      AOC_SERVICE_TOKEN: ${AOC_SERVICE_TOKEN:-dev-local-service-token-32bytes!}
      AOC_CITYNODE_GRPC_ADDR: ":${CITYNODE_GRPC_PORT:-50056}"
      AOC_CITYNODE_GRPC_BIND_ADDR: ":${CITYNODE_GRPC_PORT:-50056}"
      AOC_CITYNODE_SEED: /app/config/seeds/citynode_seed.json
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - service_net
      - data_net
    healthcheck:
      test: ["CMD", "/usr/local/bin/service", "-healthcheck"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 5

  quest:
    <<: *hardened
    container_name: aoc-quest
    hostname: quest
    build:
      context: ..
      dockerfile: src/deploy/docker/go.Dockerfile
      target: quest
      args:
        SERVICE_NAME: quest
        SERVICE_GRPC_PORT: ${QUEST_GRPC_PORT:-50057}
    image: sandal-quest:local
    command: ["-addr=:${QUEST_GRPC_PORT:-50057}"]
    environment:
      AOC_ENV: ${AOC_ENV:-production}
      AOC_ALLOW_INSECURE_DB: "1"
      DATABASE_URL: postgres://${POSTGRES_USER:-aoc}:${POSTGRES_PASSWORD:-CHANGE_ME}@postgres:5432/${POSTGRES_DB:-aoc}?sslmode=disable
      AOC_DATABASE_URL: postgres://${POSTGRES_USER:-aoc}:${POSTGRES_PASSWORD:-CHANGE_ME}@postgres:5432/${POSTGRES_DB:-aoc}?sslmode=disable
      AOC_DB_MAX_CONNS: "${AOC_DB_MAX_CONNS:-16}"
      AOC_DB_MIN_CONNS: "${AOC_DB_MIN_CONNS:-2}"
      AOC_SERVICE_TOKEN: ${AOC_SERVICE_TOKEN:-dev-local-service-token-32bytes!}
      AOC_QUESTS_GRPC_ADDR: ":${QUEST_GRPC_PORT:-50057}"
      AOC_QUEST_GRPC_ADDR: ":${QUEST_GRPC_PORT:-50057}"
      AOC_QUEST_GRPC_BIND_ADDR: ":${QUEST_GRPC_PORT:-50057}"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - service_net
      - data_net
    healthcheck:
      test: ["CMD", "/usr/local/bin/service", "-healthcheck"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 5

  mesh:
    <<: *hardened
    container_name: aoc-mesh
    hostname: mesh
    build:
      context: ..
      dockerfile: src/deploy/docker/go.Dockerfile
      target: mesh
      args:
        SERVICE_NAME: mesh
        SERVICE_GRPC_PORT: ${MESH_GRPC_PORT:-50054}
    image: sandal-mesh:local
    command: ["-addr=:${MESH_GRPC_PORT:-50054}"]
    environment:
      AOC_ENV: ${AOC_ENV:-production}
      AOC_ALLOW_INSECURE_DB: "1"
      DATABASE_URL: postgres://${POSTGRES_USER:-aoc}:${POSTGRES_PASSWORD:-CHANGE_ME}@postgres:5432/${POSTGRES_DB:-aoc}?sslmode=disable
      AOC_DATABASE_URL: postgres://${POSTGRES_USER:-aoc}:${POSTGRES_PASSWORD:-CHANGE_ME}@postgres:5432/${POSTGRES_DB:-aoc}?sslmode=disable
      AOC_DB_MAX_CONNS: "${AOC_DB_MAX_CONNS:-16}"
      AOC_DB_MIN_CONNS: "${AOC_DB_MIN_CONNS:-2}"
      AOC_SERVICE_TOKEN: ${AOC_SERVICE_TOKEN:-dev-local-service-token-32bytes!}
      AOC_MESH_GRPC_ADDR: ":${MESH_GRPC_PORT:-50054}"
      AOC_MESH_GRPC_BIND_ADDR: ":${MESH_GRPC_PORT:-50054}"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - service_net
      - data_net
    healthcheck:
      test: ["CMD", "/usr/local/bin/service", "-healthcheck"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 5

  gateway:
    <<: *hardened
    container_name: aoc-gateway
    hostname: gateway
    build:
      context: ..
      dockerfile: src/deploy/docker/go.Dockerfile
      target: gateway
      args:
        SERVICE_NAME: gateway
        SERVICE_HTTP_PORT: ${GATEWAY_HTTP_PORT:-8081}
        SERVICE_GRPC_PORT: ${GATEWAY_GRPC_PORT:-50050}
    image: sandal-gateway:local
    cpus: 2.0
    mem_limit: 1g
    sysctls:
      net.core.somaxconn: 65535
    command:
      - "-http=:${GATEWAY_HTTP_PORT:-8081}"
      - "-grpc=:${GATEWAY_GRPC_PORT:-50050}"
      - "-auth=${AUTH_GRPC_ADDR:-auth:50052}"
      - "-char=${CHAR_GRPC_ADDR:-character:50053}"
      - "-citynode=${CITYNODE_GRPC_ADDR:-citynode:50056}"
      - "-quest=${QUEST_GRPC_ADDR:-quest:50057}"
      - "-mesh=${MESH_GRPC_ADDR:-mesh:50054}"
      - "-world-host=${WORLD_PUBLIC_HOST:-127.0.0.1}"
      - "-world-port=${WORLD_UDP_PORT:-7777}"
      - "-content-db=/app/dist/content/content.db"
    environment:
      AOC_ENV: ${AOC_ENV:-production}
      AOC_ALLOW_INSECURE_DB: "1"
      AOC_GATEWAY_GRPC_PUBLIC: "1"
      GRPC_ENFORCE_ALPN_ENABLED: "false"
      AOC_SERVICE_TOKEN: ${AOC_SERVICE_TOKEN:-dev-local-service-token-32bytes!}
      AOC_GATEWAY_HTTP_ADDR: ":${GATEWAY_HTTP_PORT:-8081}"
      AOC_GATEWAY_HTTP_BIND_ADDR: ":${GATEWAY_HTTP_PORT:-8081}"
      AOC_GATEWAY_ICS_ADDR: ":50061"
      AOC_GATEWAY_GRPC_ADDR: ":${GATEWAY_GRPC_PORT:-50050}"
      AOC_GATEWAY_GRPC_BIND_ADDR: ":${GATEWAY_GRPC_PORT:-50050}"
      AOC_GATEWAY_TLS_ADDR: ":50061"
      AOC_GATEWAY_TLS_CERT: "${AOC_GATEWAY_TLS_CERT:-/app/certs/server.pem}"
      AOC_GATEWAY_TLS_KEY: "${AOC_GATEWAY_TLS_KEY:-/app/certs/server.key}"
      AOC_AUTH_HTTP_ADDR: "http://auth:8081"
      AOC_AUTH_ADDR: http://auth:8081
      AOC_AUTH_GRPC_ADDR: ${AUTH_GRPC_ADDR:-auth:50052}
      AUTH_GRPC_ADDR: ${AUTH_GRPC_ADDR:-auth:50052}
      AOC_CHAR_GRPC_ADDR: ${CHAR_GRPC_ADDR:-character:50053}
      AOC_CHARACTER_GRPC_ADDR: ${CHAR_GRPC_ADDR:-character:50053}
      CHAR_GRPC_ADDR: ${CHAR_GRPC_ADDR:-character:50053}
      AOC_CITYNODE_GRPC_ADDR: ${CITYNODE_GRPC_ADDR:-citynode:50056}
      CITYNODE_GRPC_ADDR: ${CITYNODE_GRPC_ADDR:-citynode:50056}
      AOC_QUESTS_GRPC_ADDR: ${QUEST_GRPC_ADDR:-quest:50057}
      AOC_QUEST_GRPC_ADDR: ${QUEST_GRPC_ADDR:-quest:50057}
      QUEST_GRPC_ADDR: ${QUEST_GRPC_ADDR:-quest:50057}
      AOC_MESH_GRPC_ADDR: ${MESH_GRPC_ADDR:-mesh:50054}
      MESH_GRPC_ADDR: ${MESH_GRPC_ADDR:-mesh:50054}
      WORLD_HOST: ${WORLD_PUBLIC_HOST:-127.0.0.1}
      WORLD_PORT: ${WORLD_UDP_PORT:-7777}
      DATABASE_URL: postgres://${POSTGRES_USER:-aoc}:${POSTGRES_PASSWORD:-CHANGE_ME}@postgres:5432/${POSTGRES_DB:-aoc}?sslmode=disable
      AOC_DATABASE_URL: postgres://${POSTGRES_USER:-aoc}:${POSTGRES_PASSWORD:-CHANGE_ME}@postgres:5432/${POSTGRES_DB:-aoc}?sslmode=disable
      AOC_DB_MAX_CONNS: "${AOC_DB_MAX_CONNS:-16}"
      AOC_DB_MIN_CONNS: "${AOC_DB_MIN_CONNS:-2}"
    volumes:
      - ${AOC_DIST_CONTENT_DIR:-./content}:/app/dist/content:ro
      - ${AOC_DIST_CERTS_DIR:-./certs}:/app/certs:ro
    depends_on:
      postgres:
        condition: service_healthy
      auth:
        condition: service_healthy
      character:
        condition: service_healthy
      citynode:
        condition: service_healthy
      quest:
        condition: service_healthy
      mesh:
        condition: service_healthy
    networks:
      - service_net
      - data_net
    healthcheck:
      test: ["CMD", "/usr/local/bin/service", "-healthcheck"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 5

  mesh-gateway:
    <<: *hardened
    container_name: aoc-mesh-gateway
    hostname: mesh-gateway
    build:
      context: ..
      dockerfile: src/deploy/docker/go.Dockerfile
      target: mesh-gateway
      args:
        SERVICE_NAME: mesh-gateway
        SERVICE_HTTP_PORT: ${MESH_GATEWAY_HTTP_PORT:-8082}
    image: sandal-mesh-gateway:local
    command:
      - "-http=:${MESH_GATEWAY_HTTP_PORT:-8082}"
      - "-mesh=${MESH_GRPC_ADDR:-mesh:50054}"
      - "-citynode=${CITYNODE_GRPC_ADDR:-citynode:50056}"
      - "-quest=${QUEST_GRPC_ADDR:-quest:50057}"
      - "-world-admin=${WORLD_ADMIN_GRPC_ADDR:-world:50061}"
    environment:
      AOC_ENV: ${AOC_ENV:-production}
      AOC_ALLOW_INSECURE_DB: "1"
      AOC_SERVICE_TOKEN: ${AOC_SERVICE_TOKEN:-dev-local-service-token-32bytes!}
      AOC_MESH_GATEWAY_ADDR: ":${MESH_GATEWAY_HTTP_PORT:-8082}"
      AOC_MESH_GATEWAY_HTTP_BIND_ADDR: ":${MESH_GATEWAY_HTTP_PORT:-8082}"
      AOC_MESH_GRPC_ADDR: ${MESH_GRPC_ADDR:-mesh:50054}
      MESH_GRPC_ADDR: ${MESH_GRPC_ADDR:-mesh:50054}
      AOC_CITYNODE_GRPC_ADDR: ${CITYNODE_GRPC_ADDR:-citynode:50056}
      CITYNODE_GRPC_ADDR: ${CITYNODE_GRPC_ADDR:-citynode:50056}
      AOC_QUESTS_GRPC_ADDR: ${QUEST_GRPC_ADDR:-quest:50057}
      AOC_QUEST_GRPC_ADDR: ${QUEST_GRPC_ADDR:-quest:50057}
      QUEST_GRPC_ADDR: ${QUEST_GRPC_ADDR:-quest:50057}
      AOC_WORLD_ADMIN_ADDR: ${WORLD_ADMIN_GRPC_ADDR:-world:50061}
      WORLD_ADMIN_GRPC_ADDR: ${WORLD_ADMIN_GRPC_ADDR:-world:50061}
      AOC_WORLD_STREAM_ADDR: ${WORLD_STREAM_GRPC_ADDR:-world:50062}
      DATABASE_URL: postgres://${POSTGRES_USER:-aoc}:${POSTGRES_PASSWORD:-CHANGE_ME}@postgres:5432/${POSTGRES_DB:-aoc}?sslmode=disable
      AOC_DATABASE_URL: postgres://${POSTGRES_USER:-aoc}:${POSTGRES_PASSWORD:-CHANGE_ME}@postgres:5432/${POSTGRES_DB:-aoc}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
      mesh:
        condition: service_healthy
      citynode:
        condition: service_healthy
      quest:
        condition: service_healthy
      world:
        condition: service_healthy
    networks:
      - service_net
      - data_net
    healthcheck:
      test: ["CMD", "/usr/local/bin/service", "-healthcheck"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 5

  web-admin:
    <<: *hardened
    container_name: aoc-web-admin
    hostname: web-admin
    build:
      context: ..
      dockerfile: src/deploy/docker/web.Dockerfile
      args:
        WEB_PORT: ${WEB_ADMIN_PORT:-8088}
    image: sandal-web-admin:local
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
      - /var/cache/nginx:rw,noexec,nosuid,nodev
      - /var/run:rw,noexec,nosuid,nodev
      - /app/logs:rw,noexec,nosuid,nodev
    environment:
      WEB_PORT: ${WEB_ADMIN_PORT:-8088}
    networks:
      - service_net
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/healthz"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 5

  world:
    <<: *hardened
    container_name: aoc-world
    hostname: world
    build:
      context: ..
      dockerfile: src/deploy/docker/cpp.Dockerfile
      target: world
      args:
        TARGET_BINARY: world
        WORLD_UDP_PORT: ${WORLD_UDP_PORT:-7777}
        WORLD_ADMIN_PORT: ${WORLD_ADMIN_PORT:-50061}
    image: sandal-world:local
    cpus: 4.0
    mem_limit: 4g
    entrypoint: ["/app/world"]
    command:
      - "--mesh=mesh:50054"
      - "--gateway=gateway:50050"
      - "--character=character:50053"
      - "--citynode=citynode:50056"
      - "--port=${WORLD_UDP_PORT:-7777}"
      - "--admin-port=${WORLD_ADMIN_PORT:-50061}"
    environment:
      WORLD_UDP_PORT: ${WORLD_UDP_PORT:-7777}
      WORLD_ADMIN_PORT: ${WORLD_ADMIN_PORT:-50061}
      AOC_WORLD_UDP_PORT: ${WORLD_UDP_PORT:-7777}
      AOC_WORLD_ADMIN_ADDR: ":${WORLD_ADMIN_PORT:-50061}"
      AOC_CITYNODE_GRPC_ADDR: citynode:50056
      AOC_QUESTS_GRPC_ADDR: quest:50057
      AOC_CONTENT_DB: /app/content/content.db
      AOC_AREA_RADIUS_M: "${AOC_AREA_RADIUS_M:--1}"
      AOC_SERVICE_TOKEN: ${AOC_SERVICE_TOKEN:-dev-local-service-token-32bytes!}
    ports:
      - "127.0.0.1:${WORLD_UDP_PORT:-7777}:7777/udp"
    volumes:
      - ${AOC_DIST_CONTENT_DIR:-./content}:/app/content:ro
      - ${AOC_DIST_CONTENT_DIR:-./content}:/app/dist/content:ro
      - ${AOC_DIST_NAV_DIR:-./nav}:/app/nav:ro
      - ${AOC_DIST_CONFIG_DIR:-./config}:/app/config:ro
    depends_on:
      mesh:
        condition: service_healthy
      gateway:
        condition: service_healthy
      character:
        condition: service_healthy
      citynode:
        condition: service_healthy
    networks:
      - edge_net
      - service_net
    healthcheck:
      test: ["CMD", "/app/world", "--healthcheck", "http://127.0.0.1:50061/livez"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 5

  ingress-proxy:
    <<: *hardened
    container_name: aoc-ingress-proxy
    hostname: ingress-proxy
    build:
      context: ..
      dockerfile: src/deploy/docker/envoy.Dockerfile
      args:
        ENVOY_HTTP_INGRESS_PORT: ${INGRESS_HTTP_PORT:-8080}
        ENVOY_GRPC_INGRESS_PORT: ${INGRESS_GRPC_PORT:-9090}
        ENVOY_ADMIN_PORT: ${ENVOY_ADMIN_PORT:-9901}
    image: sandal-envoy:local
    cpus: 2.0
    mem_limit: 1g
    sysctls:
      net.core.somaxconn: 65535
    environment:
      ENVOY_HTTP_INGRESS_PORT: ${INGRESS_HTTP_PORT:-8080}
      ENVOY_GRPC_INGRESS_PORT: ${INGRESS_GRPC_PORT:-9090}
      ENVOY_ADMIN_PORT: ${ENVOY_ADMIN_PORT:-9901}
    ports:
      - "127.0.0.1:${INGRESS_HTTP_PORT:-8080}:8080/tcp"
      - "127.0.0.1:${INGRESS_GRPC_PORT:-9090}:9090/tcp"
      - "127.0.0.1:${GATEWAY_TLS_PORT:-50061}:50061/tcp"
    depends_on:
      gateway:
        condition: service_healthy
      mesh-gateway:
        condition: service_healthy
      web-admin:
        condition: service_healthy
      auth:
        condition: service_healthy
      character:
        condition: service_healthy
      citynode:
        condition: service_healthy
      quest:
        condition: service_healthy
      mesh:
        condition: service_healthy
      world:
        condition: service_healthy
    networks:
      - edge_net
      - service_net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:9901/ready"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 5

networks:
  edge_net:
    driver: bridge
  service_net:
    driver: bridge
    internal: true
  data_net:
    driver: bridge
    internal: true

volumes:
  pgdata:
