# Local development infrastructure for the Go services and world.
#   docker compose -f src/deploy/docker-compose.yml up -d --wait
name: aoc

services:
  postgres:
    image: postgres:17
    cpus: 1.0
    mem_limit: 512m
    shm_size: 256m
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "effective_cache_size=384MB", "-c", "work_mem=4MB", "-c", "maintenance_work_mem=32MB", "-c", "wal_buffers=4MB", "-c", "checkpoint_completion_target=0.9", "-c", "random_page_cost=1.1", "-c", "jit=off", "-c", "max_connections=100"]
    environment:
      POSTGRES_USER: aoc
      POSTGRES_PASSWORD: aoc
      POSTGRES_DB: aoc
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Over TCP: during first-start init only the unix socket is served, so
      # this turns healthy once the final server (and aoc_test) is up.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U aoc -d aoc"]
      interval: 2s
      timeout: 3s
      retries: 30

  nats:
    image: nats:2.10
    cpus: 1.0
    mem_limit: 256m
    command: ["-js", "-m", "8222", "--max_payload", "1MB", "--max_pending", "16MB", "--write_deadline", "5s", "--store_dir", "/tmp/nats", "--max_mem_store", "64MB", "--max_file_store", "256MB"]
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"

volumes:
  pgdata:
