# SPDX-License-Identifier: AGPL-3.0-only
# High-throughput Envoy HTTP/1.1, WebSocket/SSE, and HTTP/2 gRPC ingress configuration.

admin:
  access_log_path: /tmp/envoy_admin_access.log
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901

static_resources:
  listeners:
    - name: ingress_http
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8080
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                codec_type: AUTO
                upgrade_configs:
                  - upgrade_type: websocket
                http2_protocol_options:
                  max_concurrent_streams: 1024
                  initial_stream_window_size: 16777216
                  initial_connection_window_size: 25165824
                route_config:
                  name: ingress_http_route
                  virtual_hosts:
                    - name: sandal_http_vhost
                      domains: ["*"]
                      typed_per_filter_config:
                        envoy.filters.http.cors:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.CorsPolicy
                          allow_origin_string_match:
                            - safe_regex:
                                regex: ".*"
                          allow_methods: "DELETE, GET, POST, PUT, PATCH, OPTIONS"
                          allow_headers: "Authorization, Content-Type, X-Service-Token, X-Idempotency-Key, Idempotency-Key, ETag, If-None-Match, If-Match, Alt-Svc"
                          expose_headers: "ETag, If-None-Match, If-Match, Alt-Svc, Retry-After"
                      routes:
                        # /api/v1/auth/* & /v1/account -> gateway_http (gateway:8081)
                        - match:
                            prefix: "/api/v1/auth/account"
                          route:
                            cluster: gateway_http
                            timeout: 15s
                        - match:
                            prefix: "/api/v1/auth/"
                          route:
                            cluster: gateway_http
                            timeout: 15s
                        - match:
                            prefix: "/api/v1/auth"
                          route:
                            cluster: gateway_http
                            timeout: 15s
                        - match:
                            prefix: "/v1/account"
                          route:
                            cluster: gateway_http
                            timeout: 15s
                        # /api/v1/characters/* -> gateway_http (gateway:8081)
                        - match:
                            prefix: "/api/v1/characters/"
                          route:
                            cluster: gateway_http
                            timeout: 15s
                        - match:
                            prefix: "/api/v1/characters"
                          route:
                            cluster: gateway_http
                            timeout: 15s
                        # /api/v1/catalog/* -> gateway_http (gateway:8081)
                        - match:
                            prefix: "/api/v1/catalog/"
                          route:
                            cluster: gateway_http
                            timeout: 15s
                        - match:
                            prefix: "/api/v1/catalog"
                          route:
                            cluster: gateway_http
                            timeout: 15s
                        # /api/v1/world/* -> gateway_http (gateway:8081)
                        - match:
                            prefix: "/api/v1/world/"
                          route:
                            cluster: gateway_http
                            timeout: 15s
                        - match:
                            prefix: "/api/v1/world"
                          route:
                            cluster: gateway_http
                            timeout: 15s
                        # /api/v1/gm/* -> meshgw_http (meshgw:8082)
                        - match:
                            prefix: "/api/v1/gm/"
                          route:
                            cluster: meshgw_http
                            timeout: 30s
                        - match:
                            prefix: "/api/v1/gm"
                          route:
                            cluster: meshgw_http
                            timeout: 30s
                        # / -> web_admin_http (web-admin:8088)
                        - match:
                            prefix: "/"
                          route:
                            cluster: web_admin_http
                            timeout: 30s
                http_filters:
                  - name: envoy.filters.http.cors
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

    - name: ingress_grpc
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 9090
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_grpc
                codec_type: HTTP2
                http2_protocol_options:
                  max_concurrent_streams: 1024
                  initial_stream_window_size: 16777216
                  initial_connection_window_size: 25165824
                route_config:
                  name: ingress_grpc_route
                  virtual_hosts:
                    - name: sandal_grpc_vhost
                      domains: ["*"]
                      routes:
                        # /aoc.auth.v1. -> auth_grpc (auth:50052)
                        - match:
                            prefix: "/aoc.auth.v1."
                          route:
                            cluster: auth_grpc
                            timeout: 15s
                        # /aoc.gateway.v1. -> gateway_grpc (gateway:50050)
                        - match:
                            prefix: "/aoc.gateway.v1."
                          route:
                            cluster: gateway_grpc
                            timeout: 15s
                        # /aoc.character.v1. -> character_grpc (character:50053)
                        - match:
                            prefix: "/aoc.character.v1."
                          route:
                            cluster: character_grpc
                            timeout: 15s
                        # /aoc.mesh.v1. -> mesh_grpc (mesh:50054)
                        - match:
                            prefix: "/aoc.mesh.v1."
                          route:
                            cluster: mesh_grpc
                            timeout: 15s
                        # /aoc.citynode.v1. -> citynode_grpc (citynode:50056)
                        - match:
                            prefix: "/aoc.citynode.v1."
                          route:
                            cluster: citynode_grpc
                            timeout: 15s
                        # /aoc.quest.v1. -> quest_grpc (quest:50057)
                        - match:
                            prefix: "/aoc.quest.v1."
                          route:
                            cluster: quest_grpc
                            timeout: 15s
                        # /aoc.worldadmin.v1. -> worldd_admin_grpc (worldd:50061)
                        - match:
                            prefix: "/aoc.worldadmin.v1."
                          route:
                            cluster: worldd_admin_grpc
                            timeout: 15s
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

    - name: ingress_gateway_tls
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 50061
      filter_chains:
        - filters:
            - name: envoy.filters.network.tcp_proxy
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
                stat_prefix: ingress_gateway_tls
                cluster: gateway_tls

    - name: ingress_tether_tcp
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 50051
      filter_chains:
        - filters:
            - name: envoy.filters.network.tcp_proxy
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
                stat_prefix: ingress_tether_tcp
                cluster: tether_tcp

  clusters:
    - name: gateway_http
      connect_timeout: 2s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      http2_protocol_options: {}
      circuit_breakers:
        thresholds:
          - max_connections: 10000
            max_pending_requests: 10000
            max_requests: 10000
      health_checks:
        - timeout: 2s
          interval: 5s
          unhealthy_threshold: 3
          healthy_threshold: 1
          tcp_health_check: {}
      load_assignment:
        cluster_name: gateway_http
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: gateway
                      port_value: 8081

    - name: meshgw_http
