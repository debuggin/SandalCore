# SPDX-License-Identifier: AGPL-3.0-only
# Production Kubernetes Deployments, Services, PDBs & HPAs for stateless Go services (K8S-01, K8S-02, K8S-04, SEC-13)
apiVersion: v1
kind: ConfigMap
metadata:
  name: sandal-prod-config
  namespace: sandal
  labels:
    app.kubernetes.io/part-of: sandalcore
data:
  AOC_ENV: "production"
  AOC_DB_MAX_CONNS: "16"
  AOC_DB_MIN_CONNS: "2"
  AOC_DB_MAX_CONN_LIFETIME: "30m"
  AOC_DB_MAX_CONN_IDLE_TIME: "5m"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: sandal
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/component: control-plane
    app.kubernetes.io/part-of: sandalcore
spec:
  replicas: 3
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
        app.kubernetes.io/component: control-plane
        app.kubernetes.io/part-of: sandalcore
        app.kubernetes.io/tier: backend
    spec:
      automountServiceAccountToken: false
      priorityClassName: production-standard
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: gateway
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: gateway
      containers:
        - name: gateway
          image: ghcr.io/sandalcore/gateway@sha256:e8a404fc10b4fb422c6a6d615c0b9a9c242b9d8f3b2a1c4d5e6f7a8b9c0d1e2f
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
            - name: grpc
              containerPort: 50050
              protocol: TCP
          envFrom:
            - configMapRef:
                name: sandal-prod-config
            - secretRef:
                name: sandal-prod-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          startupProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: tmp-run
              mountPath: /tmp
      volumes:
        - name: tmp-run
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: sandal
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: sandalcore
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: gateway
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
    - name: grpc
      port: 50050
      targetPort: grpc
      protocol: TCP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gateway-pdb
  namespace: sandal
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: sandalcore
spec:
  maxUnavailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway-hpa
  namespace: sandal
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: sandalcore
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gateway
  minReplicas: 3
  maxReplicas: 15
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mesh-gateway
  namespace: sandal
  labels:
    app.kubernetes.io/name: mesh-gateway
    app.kubernetes.io/component: dataplane-proxy
    app.kubernetes.io/part-of: sandalcore
spec:
  replicas: 3
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mesh-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mesh-gateway
        app.kubernetes.io/component: dataplane-proxy
        app.kubernetes.io/part-of: sandalcore
        app.kubernetes.io/tier: backend
    spec:
      automountServiceAccountToken: false
      priorityClassName: production-critical
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: mesh-gateway
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: mesh-gateway
      containers:
        - name: mesh-gateway
          image: ghcr.io/sandalcore/mesh-gateway@sha256:e8a404fc10b4fb422c6a6d615c0b9a9c242b9d8f3b2a1c4d5e6f7a8b9c0d1e2f
          imagePullPolicy: IfNotPresent
          ports:
            - name: udp-ingress
              containerPort: 7777
              protocol: UDP
            - name: grpc-mesh
              containerPort: 50054
              protocol: TCP
            - name: http-probe
              containerPort: 8082
              protocol: TCP
          envFrom:
            - configMapRef:
                name: sandal-prod-config
            - secretRef:
                name: sandal-prod-secrets
          resources:
            requests:
              cpu: "1000m"
              memory: "1Gi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          startupProbe:
            httpGet:
              path: /livez
              port: http-probe
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: http-probe
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http-probe
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: tmp-run
              mountPath: /tmp
      volumes:
        - name: tmp-run
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mesh-gateway
  namespace: sandal
  labels:
    app.kubernetes.io/name: mesh-gateway
    app.kubernetes.io/part-of: sandalcore
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mesh-gateway
  ports:
    - name: udp-ingress
      port: 7777
      targetPort: udp-ingress
      protocol: UDP
    - name: grpc-mesh
      port: 50054
      targetPort: grpc-mesh
      protocol: TCP
    - name: http-probe
      port: 8082
      targetPort: http-probe
      protocol: TCP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mesh-gateway-pdb
  namespace: sandal
  labels:
    app.kubernetes.io/name: mesh-gateway
    app.kubernetes.io/part-of: sandalcore
spec:
  maxUnavailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app.kubernetes.io/name: mesh-gateway
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mesh-gateway-hpa
  namespace: sandal
  labels:
    app.kubernetes.io/name: mesh-gateway
    app.kubernetes.io/part-of: sandalcore
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mesh-gateway
  minReplicas: 3
  maxReplicas: 20
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
---
