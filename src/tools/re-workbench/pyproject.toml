[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "re-workbench"
version = "0.1.0"
description = "Clean-room reverse-engineering static schema and capture workbench"
requires-python = ">=3.12"
dependencies = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["re_workbench"]
[tool.pytest.ini_options]
testpaths = ["re_workbench", "../../tests/python"]
python_files = ["static_rizin_usmap.py", "capture_pipeline.py", "test_*.py"]
